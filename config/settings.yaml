general:
  log_level: INFO
  output_dir: reports/
  max_threads: 30             # safe — not too fast
  timeout: 15000              # ms
  enforce_allowlist: true     # critical
  allowlist_file: "config/allowlists.txt"
  allow_local: false

scan:
  port_range: "1‑1000"        # full = 1‑65535, start smaller
  fast_scan: true
  evasion:
    enabled: true
    delay_ms: 200
    fragment_packets: false

recon:
  dns_timeout: 4
  dns_bruteforce: true
  subdomain_wordlist: "config/wordlists/subdomains.txt"

exploit:
  simulation_only: true       # NEVER set false unless fully authorized
  max_depth: 2

reporting:
  formats: ["html","json"]
  cvss_min_score: 4.0
  
